name: Release

# Changesets flow: on merge to main, open/refresh a "Version Packages" PR; when that
# PR merges, bump versions, write CHANGELOG, and tag the release (private app — no npm publish).
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create Version PR / tag release
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          # Private app → no npm publish; `changeset tag` cuts git tags + GitHub Releases.
          publish: pnpm changeset:tag
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          # Prefer a PAT/GitHub App token for PR creation when org policy blocks GITHUB_TOKEN PRs.
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GH_RELEASE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
